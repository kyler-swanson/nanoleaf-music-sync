[package]
name = "nanoleaf-sync"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "nanoleaf_sync_lib"

[dependencies]
nanoleaf-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tracing = "0.1.44"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
